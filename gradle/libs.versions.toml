[versions]
protobuf = "4.36.2"
junit = "6.1.3"

[plugins]
protobuf = "com.google.protobuf:0.10.1"
lombok = "io.freefair.lombok:9.8.3"
jmh = "me.champeau.jmh:0.7.4"
jcstress = "io.github.reyerizo.gradle.jcstress:1.0.0"

[libraries]
protoc = { module = "com.google.protobuf:protoc", version.ref = "protobuf" }

testcontainers-bom = "org.testcontainers:testcontainers-bom:2.0.5"
testcontainers-junitJupiter.module = "org.testcontainers:testcontainers-junit-jupiter"
testcontainers-kafka.module = "org.testcontainers:testcontainers-kafka"

log4j2-bom = "org.apache.logging.log4j:log4j-bom:2.26.1"
log4j2-api.module = "org.apache.logging.log4j:log4j-api"
log4j2-slf4j2Impl.module = "org.apache.logging.log4j:log4j-slf4j2-impl"

protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
gson = "com.google.code.gson:gson:2.14.0"
kafka-clients = "org.apache.kafka:kafka-clients:4.4.0"
