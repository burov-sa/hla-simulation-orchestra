# Устанавливаем базовый уровень логирования - WARN (предупреждения и ошибки)
org.slf4j.simpleLogger.defaultLogLevel=warn

# Настраиваем формат вывода (время, сообщение)
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSS
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.showLogName=false
org.slf4j.simpleLogger.showShortLogName=true

# Точечно скрываем самые шумные внутренние классы Kafka (по желанию)
org.slf4j.simpleLogger.log.org.apache.kafka.clients.NetworkClient=error
org.slf4j.simpleLogger.log.org.apache.kafka.clients.Metadata=error